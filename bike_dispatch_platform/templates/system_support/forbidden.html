{% extends "base.html" %}

{% block title %}访问受限 - 基于深度学习的城市共享单车调度需求预测与运维管理平台{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0"><i class="bi bi-shield-lock"></i> 403 访问受限</h4>
        </div>
        <div class="card-body">
            <p class="mb-3">{{ error_message }}</p>
            <p class="text-muted mb-4">请使用具备相应角色权限的账号重新访问该页面或接口。</p>
            <a href="{% url 'system_support:dashboard' %}" class="btn btn-primary">返回系统总览</a>
        </div>
    </div>
</div>
{% endblock %}
