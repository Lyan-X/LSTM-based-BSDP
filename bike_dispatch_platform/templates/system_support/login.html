<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - {{ project_name }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-container { background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 48px; width: 420px; max-width: 90%; }
        .login-header { text-align: center; margin-bottom: 36px; }
        .login-header h1 { font-size: 1.6rem; color: #1a1a2e; margin-bottom: 8px; }
        .login-header p { color: #666; font-size: 0.9rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; color: #333; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 12px 16px; border: 2px solid #e1e1e1; border-radius: 8px; font-size: 1rem; transition: border-color 0.3s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #667eea; }
        .btn-login { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4); }
        .btn-login.is-loading { position: relative; pointer-events: none; color: transparent; }
        .btn-login.is-loading::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1.1rem;
            height: 1.1rem;
            margin-top: -0.55rem;
            margin-left: -0.55rem;
            border: 2px solid rgba(255,255,255,0.45);
            border-top-color: #fff;
            border-radius: 50%;
            animation: loginSpin 0.8s linear infinite;
        }
        @keyframes loginSpin { to { transform: rotate(360deg); } }
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; }
        .alert-error { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
        .role-selector { display: flex; gap: 12px; }
        .role-selector label { flex: 1; text-align: center; padding: 10px; border: 2px solid #e1e1e1; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .role-selector input { display: none; }
        .role-selector input:checked + span { color: #667eea; font-weight: 600; }
        .role-selector label:has(input:checked) { border-color: #667eea; background: #f8f6ff; }
        .login-loading-mask {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .login-loading-card {
            width: min(320px, 86vw);
            padding: 1.4rem 1.5rem;
            border-radius: 18px;
            background: rgba(255,255,255,0.96);
            box-shadow: 0 22px 60px rgba(0,0,0,0.18);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-loading-mask" id="loginLoadingMask" aria-hidden="true">
        <div class="login-loading-card">
            <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
            <div class="mt-3 fw-semibold">正在登录，请稍候...</div>
            <div class="small text-secondary mt-2">系统正在加载最新的真实数据视图</div>
        </div>
    </div>
    <div class="login-container">
        <div class="login-header">
            <h1>{{ project_name }}</h1>
            <p>共享单车调度需求预测与运维管理</p>
            <p style="margin-top:6px;color:#4b5563;font-size:0.86rem;line-height:1.5;">系统仅保留 3 个账号：管理员 `admin / 123456aA`、运维 `operator / 123456aA`、预测 `predictor / 123456aA`。</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post" id="loginForm">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label>角色</label>
                <div class="role-selector">
                    <label><input type="radio" name="role" value="admin" checked><span>管理员</span></label>
                    <label><input type="radio" name="role" value="operator"><span>运维</span></label>
                    <label><input type="radio" name="role" value="predictor"><span>预测</span></label>
                </div>
                <div style="margin-top:8px;color:#6b7280;font-size:0.82rem;line-height:1.5;">仅支持以上 3 个固定角色；选择的角色必须与账号本身一致。</div>
            </div>
            <button type="submit" class="btn-login" id="loginSubmitBtn">登录</button>
        </form>
    </div>
    <script>
        (function () {
            const form = document.getElementById('loginForm');
            const button = document.getElementById('loginSubmitBtn');
            const mask = document.getElementById('loginLoadingMask');
            if (!form || !button || !mask) return;
            form.addEventListener('submit', function () {
                button.classList.add('is-loading');
                button.disabled = true;
                mask.style.display = 'flex';
            });
        })();
    </script>
</body>
</html>
