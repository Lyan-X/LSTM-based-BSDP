{% extends 'base.html' %}

{% block title %}骑行数据上传 - 共享单车运维平台{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <h1 class="mb-4">
                <i class="bi bi-cloud-upload"></i> 骑行数据上传
            </h1>
            
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">上传骑行数据</h5>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data" id="uploadForm">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">数据来源</label>
                                    <input type="text" class="form-control" name="data_source" placeholder="例如：公开数据集" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">选择文件</label>
                                    <input type="file" class="form-control" name="data_file" accept=".xlsx,.csv" required onchange="previewFile(this)">
                                    <small class="form-text text-muted">支持Excel和CSV格式文件</small>
                                </div>
                                <div class="mb-3">
                                    <button type="submit" class="btn btn-primary" onclick="showProgress()">
                                        <i class="bi bi-upload"></i> 上传并清洗
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">文件预览</label>
                                    <div id="filePreview" class="border rounded p-3 bg-light" style="min-height: 200px;">
                                        <p class="text-muted text-center">请选择文件查看预览</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            
            <!-- 上传进度条 -->
            <div id="progressContainer" class="card mt-4 d-none">
                <div class="card-header">
                    <h5 class="mb-0">上传进度</h5>
                </div>
                <div class="card-body">
                    <div class="progress mb-3">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="width: 0%"></div>
                    </div>
                    <div id="progressText" class="text-center">准备上传...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// 预览文件
function previewFile(input) {
    const file = input.files[0];
    if (!file) return;
    
    const preview = document.getElementById('filePreview');
    preview.innerHTML = '<p class="text-center"><i class="bi bi-file-earmark-spreadsheet"></i> 正在解析文件...</p>';
    
    // 简单的文件预览
    if (file.name.endsWith('.csv')) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const content = e.target.result;
            const lines = content.split('\n').slice(0, 10); // 只显示前10行
            let html = '<table class="table table-sm table-striped"><thead><tr>';
            
            // 显示表头
            const headers = lines[0].split(',');
            headers.forEach(header => {
                html += `<th>${header}</th>`;
            });
            html += '</tr></thead><tbody>';
            
            // 显示数据行
            for (let i = 1; i < lines.length && i < 6; i++) {
                const cells = lines[i].split(',');
                html += '<tr>';
                cells.forEach(cell => {
                    html += `<td>${cell}</td>`;
                });
                html += '</tr>';
            }
            html += '</tbody></table>';
            html += `<p class="text-muted text-center">显示前5行数据</p>`;
            preview.innerHTML = html;
        };
        reader.readAsText(file);
    } else {
        preview.innerHTML = '<p class="text-center">Excel文件预览功能正在开发中</p>';
    }
}

// 显示上传进度
function showProgress() {
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = progressContainer.querySelector('.progress-bar');
    const progressText = document.getElementById('progressText');
    
    progressContainer.classList.remove('d-none');
    
    // 模拟进度
    let progress = 0;
    const interval = setInterval(() => {
        progress += 10;
        if (progress > 90) {
            clearInterval(interval);
            return;
        }
        progressBar.style.width = progress + '%';
        progressBar.setAttribute('aria-valuenow', progress);
        progressText.textContent = `上传中... ${progress}%`;
    }, 300);
}

// 检查URL参数中的成功消息
window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const success = urlParams.get('success');
    const count = urlParams.get('count');
    
    if (success) {
        showSuccessModal(count);
    }
};

// 显示成功弹窗
function showSuccessModal(count) {
    // 创建弹窗
    const modalHtml = `
        <div class="modal fade show" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="false" style="display: block;">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-success text-white">
                        <h5 class="modal-title" id="successModalLabel">
                            <i class="bi bi-check-circle"></i> 上传成功！
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p class="text-center mb-4">成功导入 <strong>${count}</strong> 条清洗后的骑行数据</p>
                        <div class="text-center">
                            <button type="button" class="btn btn-success" onclick="viewDetailedData()">
                                <i class="bi bi-table"></i> 显示详细数据信息
                            </button>
                            <button type="button" class="btn btn-secondary ms-2" data-bs-dismiss="modal">
                                <i class="bi bi-x"></i> 关闭
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-backdrop fade show"></div>
    `;
    
    // 添加到页面
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    
    // 绑定关闭事件
    document.querySelector('#successModal .btn-close').addEventListener('click', function() {
        closeModal();
    });
    
    document.querySelector('#successModal .btn-secondary').addEventListener('click', function() {
        closeModal();
    });
}

// 关闭弹窗
function closeModal() {
    const modal = document.getElementById('successModal');
    const backdrop = document.querySelector('.modal-backdrop');
    if (modal) modal.remove();
    if (backdrop) backdrop.remove();
}

// 查看详细数据信息
function viewDetailedData() {
    // 关闭弹窗
    closeModal();
    // 跳转到数据列表页面
    window.location.href = '{% url "data_process:data_list" %}';
}
</script>
{% endblock %}
