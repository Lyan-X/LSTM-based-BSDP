{% extends "base.html" %}

{% block title %}车辆监控{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row">
        <!-- 左侧控制面板 -->
        <div class="col-md-3">
            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0">控制面板</h5>
                </div>
                <div class="card-body">
                    <!-- 车辆搜索 -->
                    <div class="mb-4">
                        <h6 class="text-muted">车辆搜索</h6>
                        <div class="input-group">
                            <input type="text" id="vehicleSearchInput" class="form-control" placeholder="输入车辆编号">
                            <button class="btn btn-primary" onclick="searchVehicle()">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- 状态筛选 -->
                    <div class="mb-4">
                        <h6 class="text-muted">车辆状态</h6>
                        <div class="input-group">
                            <select id="vehicle-status-filter" class="form-select">
                                <option value="all">全部车辆</option>
                                <option value="riding">正在骑行</option>
                                <option value="parked">已停放</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- 数据统计 -->
                    <div class="mb-4">
                        <h6 class="text-muted">车辆统计</h6>
                        <div class="row text-center">
                            <div class="col-6">
                                <p class="text-muted mb-0">总车辆数</p>
                                <p id="totalVehicles" class="h5 font-weight-bold">{{ total_vehicles }}</p>
                            </div>
                            <div class="col-6">
                                <p class="text-muted mb-0">可用车辆</p>
                                <p id="availableVehicles" class="h5 font-weight-bold text-success">{{ available_vehicles }}</p>
                            </div>
                            <div class="col-6">
                                <p class="text-muted mb-0">已骑行</p>
                                <p id="riddenVehicles" class="h5 font-weight-bold text-primary">{{ ridden_vehicles }}</p>
                            </div>
                            <div class="col-6">
                                <p class="text-muted mb-0">故障车辆</p>
                                <p id="faultyVehicles" class="h5 font-weight-bold text-danger">{{ faulty_vehicles }}</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 状态说明 -->
                    <div class="mb-4">
                        <h6 class="text-muted">状态说明</h6>
                        <ul class="list-unstyled text-sm">
                            <li class="mb-1">
                                <span class="inline-block w-3 h-3 bg-green-500 rounded-full mr-2"></span>
                                可用（绿色）
                            </li>
                            <li class="mb-1">
                                <span class="inline-block w-3 h-3 bg-blue-500 rounded-full mr-2"></span>
                                已骑行（蓝色）
                            </li>
                            <li class="mb-1">
                                <span class="inline-block w-3 h-3 bg-red-500 rounded-full mr-2"></span>
                                故障（红色）
                            </li>
                            <li class="mb-1">
                                <span class="inline-block w-3 h-3 bg-yellow-500 rounded-full mr-2"></span>
                                锁定（黄色）
                            </li>
                        </ul>
                    </div>
                    
                    <!-- 刷新按钮 -->
                    <button id="refreshBtn" class="btn btn-secondary w-100" onclick="refreshData()">
                        手动刷新数据
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 右侧地图展示 -->
        <div class="col-md-9">
            <div class="card mb-4">
                <div class="card-body p-0">
                    <!-- 地图容器 -->
                    <div id="map" style="height: 800px; width: 100%;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 车辆操作模态框 -->
<div class="modal fade" id="vehicleOperationModal" tabindex="-1" aria-labelledby="vehicleOperationModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="vehicleOperationModalLabel">车辆操作</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="vehicleInfo" class="mb-4">
                    <!-- 车辆信息将通过JavaScript动态填充 -->
                </div>
                <div class="mb-4">
                    <label for="vehicleStatusSelect" class="form-label">车辆状态</label>
                    <select id="vehicleStatusSelect" class="form-select">
                        <option value="available">可用</option>
                        <option value="ridden">已骑行</option>
                        <option value="faulty">故障</option>
                        <option value="locked">锁定</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                <button type="button" class="btn btn-primary" onclick="updateVehicleStatus()">保存更改</button>
            </div>
        </div>
    </div>
</div>

        { name: "学生公寓8号楼", lat: 39.905494, lng: 119.535337 }
    ];
    
    // 全局变量
    let monitorMap;
    let vehicleMarkers = [];
    let parkingMarkers = [];
    // 测试车辆数据
    let vehiclesData = [
        {
            id: "bike_001",
            lat: 39.913239,
            lng: 119.517816,
            status: "riding",
            riding_start_time: "2026-02-05 14:30:00",

            update_time: new Date().toLocaleString()

            lng: 119.52317,
            status: "locked",
            parking_point: "材料学院A楼",
            update_time: new Date().toLocaleString()
        },
        {
            id: "bike_004",
            lat: 39.905732,
            lng: 119.523105,
            status: "faulty",
            parking_point: "2组图",
            update_time: new Date().toLocaleString()
        },
        {
            id: "bike_005",
            lat: 39.911057,
            lng: 119.517918,
            status: "riding",
            riding_start_time: "2026-02-05 14:45:00",
            current_speed: 8.3,
            parking_point: null,
            update_time: new Date().toLocaleString()
        }
    ];
    let currentVehicleId = null;
    
    /**
     * 初始化地图（无平移限制，固定最大缩放）
     * @param {string} domId 地图容器ID
     * @returns 地图实例
     */
    function initYsuMap(domId) {
        const map = L.map(domId, {
            maxZoom: MAX_ZOOM,
            // 关键：关闭所有边界限制，支持自由拖动
            maxBounds: null,
            zoomControl: true
        }).setView(YSU_CENTER, 15);
    
        // 加载底图
        L.tileLayer('https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
            attribution: '高德地图 © 共享单车系统',
            maxZoom: MAX_ZOOM
        }).addTo(map);
    
        // 绘制多边形边界（可视化标识）
        L.polygon(YSU_POLYGON, {
            color: '#1890FF',
            weight: 2,
            fillOpacity: 0.1
        }).addTo(map);
    
        return map;
    }
    
    // 坐标校验工具：判断车辆点位是否在燕大多边形内
    function isInYsuPolygon(lat, lng) {
        const point = L.latLng(lat, lng);
        const polygon = L.polygon(YSU_POLYGON);
        return polygon.getBounds().contains(point);
    }
    
    // 初始化地图
    function initMap() {
        // 1. 初始化地图（复用通用函数，无矩形约束）
        monitorMap = initYsuMap('map');
        
        // 2. 定义停车场图标（常用停车场样式）
        function createParkingIcon(isSelected) {
            return L.divIcon({
                className: 'parking-icon',
                html: `<div style="width: 30px; height: 30px; border-radius: 50%; background-color: ${isSelected ? '#FF5722' : '#1890FF'}; color: white; display: flex; align-items: center; justify-content: center; border: ${isSelected ? '2px' : '1px'} solid white; font-weight: bold;">P</div>`,
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        }
        
        // 3. 添加停车点管辖范围（30米）
        const PARKING_RADIUS = 30; // 停车点管辖范围，单位：米
        
        // 4. 渲染所有停车点
        PARKING_POINTS.forEach(point => {
            // 创建停车点图标
            const marker = L.marker([point.lat, point.lng], {
                icon: createParkingIcon(false)
            }).addTo(monitorMap);
            
            // 添加停车点管辖范围
            const radiusCircle = L.circle([point.lat, point.lng], {
                radius: PARKING_RADIUS,
                color: '#1890FF',
                fillColor: '#1890FF',
                fillOpacity: 0.1,
                weight: 1
            }).addTo(monitorMap);
            
            // 绑定弹窗
            marker.bindPopup(`
                <div class="popup-card">
                    <h5>${point.name}</h5>
                    <p>经度：${point.lng.toFixed(6)}</p>
                    <p>纬度：${point.lat.toFixed(6)}</p>
                    <p>管辖范围：${PARKING_RADIUS}米</p>
                </div>
            `);
            
            // 点击事件：切换选中状态
            marker.on('click', function() {
                // 重置所有标记
                parkingMarkers.forEach(m => {
                    m.setIcon(createParkingIcon(false));
                });
                // 设置当前标记为选中状态
                this.setIcon(createParkingIcon(true));
            });
            
            parkingMarkers.push(marker);
        });
        
        // 3. 定义车辆图标（区分不同状态）
        // 骑行中车辆图标
        const ridingIcon = L.divIcon({
            className: 'vehicle-icon',
            html: `<div style="width: 24px; height: 24px; border-radius: 50%; background-color: #FF5722; color: white; display: flex; align-items: center; justify-content: center; border: 2px solid white; font-weight: bold;">骑</div>`,
            iconSize: [24, 24],
            iconAnchor: [12, 12]
        });
        
        // 停放车辆图标
        const parkedIcon = L.divIcon({
            className: 'vehicle-icon',
            html: `<div style="width: 20px; height: 20px; border-radius: 50%; background-color: #4CAF50; color: white; display: flex; align-items: center; justify-content: center; border: 1px solid white; font-weight: bold;">停</div>`,
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });
        
        // 锁定车辆图标
        const lockedIcon = L.divIcon({
            className: 'vehicle-icon',
            html: `<div style="width: 20px; height: 20px; border-radius: 50%; background-color: #FFC107; color: white; display: flex; align-items: center; justify-content: center; border: 1px solid white; font-weight: bold;">锁</div>`,
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });
        
        // 故障车辆图标
        const faultyIcon = L.divIcon({
            className: 'vehicle-icon',
            html: `<div style="width: 20px; height: 20px; border-radius: 50%; background-color: #F44336; color: white; display: flex; align-items: center; justify-content: center; border: 1px solid white; font-weight: bold;">故</div>`,
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });
        
        // 5. 再渲染车辆信息（叠加在停车点上）
        addVehicleMarkers(ridingIcon, parkedIcon, lockedIcon, faultyIcon);
        
        // 启动定时刷新
        startAutoRefresh();
    }
    
    // 添加车辆标记
    function addVehicleMarkers(ridingIcon, parkedIcon, lockedIcon, faultyIcon) {
        // 清除现有标记
        vehicleMarkers.forEach(marker => monitorMap.removeLayer(marker));
        vehicleMarkers = [];
        
        // 添加新标记
        vehiclesData.forEach(vehicle => {
            // 2. 过滤校外数据：仅加载多边形内的车辆数据
            if (!isInYsuPolygon(vehicle.lat, vehicle.lng)) {
                return; // 跳过校外车辆
            }
            
            // 根据状态选择图标
            let icon;
            let popupContent;
            let statusText;
            let statusColor;
            
            switch (vehicle.status) {
                case 'riding':
                    icon = ridingIcon;
                    statusText = '正在骑行';
                    statusColor = '#FF5722';
                    popupContent = `
                        <div class="popup-card">
                            <h5>车辆ID：${vehicle.id}</h5>
                            <p>状态：<span style="color:${statusColor}">${statusText}</span></p>
                            <p>骑行开始：${vehicle.riding_start_time || '未知'}</p>
                            <p>当前位置：${vehicle.lat.toFixed(6)}, ${vehicle.lng.toFixed(6)}</p>
                            <p>实时速度：${vehicle.current_speed || '--'} km/h</p>
                            <button class="btn btn-sm btn-primary mt-2" onclick="openVehicleOperationModal('${vehicle.id}')">
                                操作
                            </button>
                        </div>
                    `;
                    break;
                case 'parked':
                    icon = parkedIcon;
                    statusText = '已停放';
                    statusColor = '#4CAF50';
                    popupContent = `
                        <div class="popup-card">
                            <h5>车辆ID：${vehicle.id}</h5>
                            <p>状态：<span style="color:${statusColor}">${statusText}</span></p>
                            <p>所属停车点：${vehicle.parking_point || '未知'}</p>
                            <p>坐标：${vehicle.lat.toFixed(6)}, ${vehicle.lng.toFixed(6)}</p>
                            <p>更新时间：${vehicle.update_time}</p>
                            <button class="btn btn-sm btn-primary mt-2" onclick="openVehicleOperationModal('${vehicle.id}')">
                                操作
                            </button>
                        </div>
                    `;
                    break;
                case 'locked':
                    icon = lockedIcon;
                    statusText = '已锁定';
                    statusColor = '#FFC107';
                    popupContent = `
                        <div class="popup-card">
                            <h5>车辆ID：${vehicle.id}</h5>
                            <p>状态：<span style="color:${statusColor}">${statusText}</span></p>
                            <p>所属停车点：${vehicle.parking_point || '未知'}</p>
                            <p>坐标：${vehicle.lat.toFixed(6)}, ${vehicle.lng.toFixed(6)}</p>
                            <p>更新时间：${vehicle.update_time}</p>

    // 获取状态文本
    function getStatusText(status) {
        switch (status) {
            case 'riding': return '正在骑行';
            case 'parked': return '已停放';
            case 'available': return '可用';
            case 'ridden': return '已骑行';
            case 'faulty': return '故障';
            case 'locked': return '锁定';
            default: return '未知';
        }
    }
    
    // 搜索车辆
    function searchVehicle() {
        const searchInput = document.getElementById('vehicleSearchInput').value.trim();
        if (!searchInput) {
            alert('请输入车辆编号');
            return;
        }
        
        // 查找车辆
        const vehicle = vehiclesData.find(v => v.id === searchInput || v.id.includes(searchInput));
        if (vehicle) {
            // 定位到车辆
            monitorMap.setView([vehicle.lat, vehicle.lng], 18);
            
            // 打开车辆操作模态框
            openVehicleOperationModal(vehicle.id);
        } else {
            alert('未找到车辆');
        }
    }
    
    // 打开车辆操作模态框
    function openVehicleOperationModal(vehicleId) {
        currentVehicleId = vehicleId;
        
        // 查找车辆
        const vehicle = vehiclesData.find(v => v.id === vehicleId);
        if (vehicle) {
            // 填充车辆信息
            document.getElementById('vehicleInfo').innerHTML = `
                <h6 class="font-weight-bold">车辆 ${vehicle.id}</h6>
                <p class="text-sm mb-1">当前状态: ${getStatusText(vehicle.status)}</p>
                <p class="text-sm mb-1">坐标: ${vehicle.lat.toFixed(6)}, ${vehicle.lng.toFixed(6)}</p>
                <p class="text-sm mb-1">更新时间: ${vehicle.update_time}</p>
            `;
            
            // 设置状态选择器
            document.getElementById('vehicleStatusSelect').value = vehicle.status;
            
            // 显示模态框
            const modal = new bootstrap.Modal(document.getElementById('vehicleOperationModal'));
            modal.show();
        }
    }
    
    // 更新车辆状态
    function updateVehicleStatus() {
        if (!currentVehicleId) return;
        
        const newStatus = document.getElementById('vehicleStatusSelect').value;
        
        // 显示加载状态
        const saveButton = document.querySelector('#vehicleOperationModal .btn-primary');
        saveButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 保存中...';
        saveButton.disabled = true;
        
        // 发送请求更新状态
        fetch('/operation/api/update-vehicle-status/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken()
            },
            body: JSON.stringify({
                vehicle_id: currentVehicleId,
                status: newStatus
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // 更新本地数据
                const vehicleIndex = vehiclesData.findIndex(v => v.id === currentVehicleId);
                if (vehicleIndex !== -1) {
                    vehiclesData[vehicleIndex].status = newStatus;
                    vehiclesData[vehicleIndex].update_time = new Date().toLocaleString();
                }
                
                // 更新地图标记
                // 重新定义图标
                const ridingIcon = L.divIcon({
                    className: 'vehicle-icon',
                    html: `<div style="width: 24px; height: 24px; border-radius: 50%; background-color: #FF5722; color: white; display: flex; align-items: center; justify-content: center; border: 2px solid white; font-weight: bold;">骑</div>`,
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                });
                
                const parkedIcon = L.divIcon({
                    className: 'vehicle-icon',
                    html: `<div style="width: 20px; height: 20px; border-radius: 50%; background-color: #4CAF50; color: white; display: flex; align-items: center; justify-content: center; border: 1px solid white; font-weight: bold;">停</div>`,
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });
                
                const lockedIcon = L.divIcon({
                    className: 'vehicle-icon',
                    html: `<div style="width: 20px; height: 20px; border-radius: 50%; background-color: #FFC107; color: white; display: flex; align-items: center; justify-content: center; border: 1px solid white; font-weight: bold;">锁</div>`,
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });
                
                const faultyIcon = L.divIcon({
                    className: 'vehicle-icon',
                    html: `<div style="width: 20px; height: 20px; border-radius: 50%; background-color: #F44336; color: white; display: flex; align-items: center; justify-content: center; border: 1px solid white; font-weight: bold;">故</div>`,
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });
                
                // 重新渲染符合条件的车辆
                addVehicleMarkers(ridingIcon, parkedIcon, lockedIcon, faultyIcon);
                
                // 更新统计数据
                updateVehicleStats();
                
                // 显示成功消息
                alert('车辆状态更新成功！');
                
                // 关闭模态框
                const modal = bootstrap.Modal.getInstance(document.getElementById('vehicleOperationModal'));
                modal.hide();
            } else {
                alert('车辆状态更新失败：' + data.message);
            }
        })
        .catch(error => {
            console.error('更新车辆状态失败:', error);
            alert('车辆状态更新失败，请稍后重试');
        })
        .finally(() => {
            // 恢复按钮状态
            saveButton.innerHTML = '保存更改';
            saveButton.disabled = false;
        });
    }
    
    // 更新车辆统计
    function updateVehicleStats() {
        const total = vehiclesData.length;
        const available = vehiclesData.filter(v => v.status === 'parked').length;
        const ridden = vehiclesData.filter(v => v.status === 'riding').length;
        const faulty = vehiclesData.filter(v => v.status === 'faulty').length;
        const locked = vehiclesData.filter(v => v.status === 'locked').length;
        
        document.getElementById('totalVehicles').textContent = total;
        document.getElementById('availableVehicles').textContent = available;
        document.getElementById('riddenVehicles').textContent = ridden;
        document.getElementById('faultyVehicles').textContent = faulty;
    }
    
    // 刷新数据
    function refreshData() {
        // 显示加载状态
        document.getElementById('refreshBtn').innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 刷新中...';
        
        // 从API获取最新数据
        fetch('/operation/api/vehicle-data/')
            .then(response => response.json())

                    // 更新数据
                    vehiclesData = data.data;
                    
                    // 重新定义图标
                    const ridingIcon = L.icon({

                        iconSize: [28, 28],
                        iconAnchor: [14, 28],
                        popupAnchor: [0, -28]
                    });
                    
                    const parkedIcon = L.icon({
                        iconUrl: 'https://cdn-icons-png.flaticon.com/512/2588/2588690.png',
                        iconSize: [24, 24],
                        iconAnchor: [12, 24]
                    });

                    addVehicleMarkers(ridingIcon, parkedIcon);
                    
                    // 更新统计数据
                    updateVehicleStats();

                    alert('数据刷新成功！');
                } else {
                    alert('数据刷新失败：' + data.message);
                }
            })
            .catch(error => {
                console.error('刷新数据失败:', error);
                alert('数据刷新失败，请稍后重试');
            })
            .finally(() => {
                // 恢复按钮状态
                document.getElementById('refreshBtn').textContent = '手动刷新数据';
            });

    // 启动自动刷新
    function startAutoRefresh() {
        // 每30秒自动刷新一次
        setInterval(() => {
            fetch('/operation/api/vehicle-data/')

                            iconSize: [24, 24],

                        const parkedIcon = L.divIcon({

                    console.error('自动刷新数据失败:', error);
                });
        }, 30000); // 30秒
    }
    
    // 获取CSRF令牌
    function getCsrfToken() {
        const cookieValue = document.cookie
            .split('; ')
            .find(row => row.startsWith('csrftoken='))
            ?.split('=')[1];
        return cookieValue;
    }
    
    // 状态筛选功能
    function initStatusFilter() {
        const statusFilter = document.getElementById('vehicle-status-filter');
        if (statusFilter) {
            statusFilter.addEventListener('change', function(e) {
                const selectedStatus = e.target.value;
                
                // 清除现有车辆标记（保留停车点）
                vehicleMarkers.forEach(marker => {
                    if (marker instanceof L.Marker) {
                        monitorMap.removeLayer(marker);
                    }
                });
                vehicleMarkers = [];
                
                // 重新定义图标
                const ridingIcon = L.divIcon({
                    className: 'vehicle-icon',
                    html: `<div style="width: 24px; height: 24px; border-radius: 50%; background-color: #FF5722; color: white; display: flex; align-items: center; justify-content: center; border: 2px solid white; font-weight: bold;">骑</div>`,
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                });
                
                const parkedIcon = L.divIcon({
                    className: 'vehicle-icon',

                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });
                
                // 重新渲染符合条件的车辆
                vehiclesData.forEach(vehicle => {
                    // 过滤校外数据
                    if (!isInYsuPolygon(vehicle.lat, vehicle.lng)) {
                        return;
                    }
                    
                    // 根据筛选条件过滤
                    if (selectedStatus === 'all' || vehicle.status === selectedStatus) {
                        // 根据状态选择图标
                        let icon;
                        let popupContent;
                        let statusText;

                                        <button class="btn btn-sm btn-primary mt-2" onclick="openVehicleOperationModal('${vehicle.id}')">
                                            操作
                                        </button>
                                    </div>
                                `;
                                break;
                            case 'parked':
                                icon = parkedIcon;
                                statusText = '已停放';
                                statusColor = '#4CAF50';
                                popupContent = `
                                    <div class="popup-card">
                                        <h5>车辆ID：${vehicle.id}</h5>
                                        <p>状态：<span style="color:${statusColor}">${statusText}</span></p>
                                        <p>所属停车点：${vehicle.parking_point || '未知'}</p>

                                        <button class="btn btn-sm btn-primary mt-2" onclick="openVehicleOperationModal('${vehicle.id}')">

                                        </button>
                                    </div>
                                `;
                                break;
                            case 'locked':
                                icon = lockedIcon;
                                statusText = '已锁定';
                                statusColor = '#FFC107';
                                popupContent = `
                                    <div class="popup-card">
                                        <h5>车辆ID：${vehicle.id}</h5>
                                        <p>状态：<span style="color:${statusColor}">${statusText}</span></p>
                                        <p>所属停车点：${vehicle.parking_point || '未知'}</p>

                                        <p>所属停车点：${vehicle.parking_point || '未知'}</p>

    // 页面加载完成后初始化
    window.onload = function() {
