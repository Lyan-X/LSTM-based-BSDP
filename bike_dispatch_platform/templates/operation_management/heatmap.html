{% extends "base.html" %}

{% block title %}供需热力图{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row">
        <!-- 左侧控制面板 -->
        <div class="col-md-3">
            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0">控制面板</h5>
                </div>
                <div class="card-body">

                    
                    <!-- 数据统计 -->
                    <div class="mb-4">
                        <h6 class="text-muted">数据统计</h6>
                        <div class="row text-center">
                            <div class="col-6">
                                <p class="text-muted mb-0">停车点数量</p>
                                <p id="parkingSpotCount" class="h5 font-weight-bold">0</p>
                            </div>
                            <div class="col-6">
                                <p class="text-muted mb-0">预测时段</p>
                                <p id="predictTime" class="h5 font-weight-bold">{{ current_time }}</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 状态说明 -->
                    <div class="mb-4">
                        <h6 class="text-muted">状态说明</h6>
                        <ul class="list-unstyled text-sm">
                            <li class="mb-1">
                                <span class="inline-block w-3 h-3 bg-red-500 rounded-full mr-2"></span>
                                高需求（红色）
                            </li>
                            <li class="mb-1">
                                <span class="inline-block w-3 h-3 bg-yellow-500 rounded-full mr-2"></span>
                                中等需求（黄色）
                            </li>
                            <li class="mb-1">
                                <span class="inline-block w-3 h-3 bg-green-500 rounded-full mr-2"></span>
                                低需求（绿色）
                            </li>
                        </ul>
                    </div>
                    
                    <!-- 刷新按钮 -->
                    <button id="refreshBtn" class="btn btn-secondary w-100" onclick="refreshData()">
                        手动刷新数据
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 右侧地图展示 -->
        <div class="col-md-9">
            <div class="card mb-4">
                <div class="card-body p-0">
                    <!-- 地图容器 -->
                    <div id="heat-map-container" style="height: 800px; width: 100%;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Leaflet CSS -->

        { name: "至明楼", lat: 39.901284, lng: 119.536636 },
        { name: "东区学生生活服务楼西侧", lat: 39.901898, lng: 119.536302 },
        { name: "东区学生生活服务楼东侧", lat: 39.901877, lng: 119.536619 },
        { name: "东区学生生活服务楼东北侧", lat: 39.902048, lng: 119.536717 },
        { name: "至博楼", lat: 39.901958, lng: 119.535911 },
        { name: "中快餐厅2食堂", lat: 39.902724, lng: 119.535492 },
        { name: "至雅楼南侧", lat: 39.903012, lng: 119.534896 },
        { name: "至雅楼北侧", lat: 39.903248, lng: 119.534947 },
        { name: "燕鸣湖餐厅西南侧", lat: 39.903546, lng: 119.535349 },
        { name: "燕鸣湖餐厅西北侧", lat: 39.903957, lng: 119.535433 },
        { name: "学生公寓8号楼", lat: 39.905494, lng: 119.535337 }
    ];
    
    // 全局变量
    let heatMap;
    let currentMode = 'heatmap'; // 只保留热力图模式
    let parkingSpotsData = {{ parking_spots|safe }};
    
    /**
     * 初始化地图（无平移限制，固定最大缩放）
     * @param {string} domId 地图容器ID
     * @returns 地图实例
     */
    function initYsuMap(domId) {
        const map = L.map(domId, {
            maxZoom: MAX_ZOOM,
            // 关键：关闭所有边界限制，支持自由拖动
            maxBounds: null,
            zoomControl: true
        }).setView(YSU_CENTER, 15);
    
        // 加载底图
        L.tileLayer('https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
            attribution: '高德地图 © 共享单车系统',
            maxZoom: MAX_ZOOM
        }).addTo(map);
    
        // 绘制多边形边界（可视化标识）
        L.polygon(YSU_POLYGON, {
            color: '#1890FF',
            weight: 2,
            fillOpacity: 0.1
        }).addTo(map);
    
        return map;
    }
    
    // 初始化地图
    function initMap() {
        // 1. 初始化地图
        heatMap = initYsuMap('heat-map-container');
        
        let selectedMarker = null;
        
        // 定义停车场图标（固定大小，不随地图缩放变化）
        function createParkingIcon(isSelected) {
            return L.divIcon({
                className: 'parking-icon',
                html: `<div style="width: 30px; height: 30px; border-radius: 50%; background-color: ${isSelected ? '#FF5722' : '#1890FF'}; color: white; display: flex; align-items: center; justify-content: center; border: ${isSelected ? '2px' : '1px'} solid white; font-weight: bold;">P</div>`,
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        }
        
        // 为每个停车点添加管辖范围（默认30米）
        const PARKING_RADIUS = 30; // 停车点管辖范围，单位：米
        
        // 3. 渲染所有停车点 + 绑定弹窗
        PARKING_POINTS.forEach(point => {
            // 创建停车点图标
            const marker = L.marker([point.lat, point.lng], {
                icon: createParkingIcon(false)
            }).addTo(heatMap);
            
            // 添加停车点管辖范围
            const radiusCircle = L.circle([point.lat, point.lng], {
                radius: PARKING_RADIUS,
                color: '#1890FF',
                fillColor: '#1890FF',
                fillOpacity: 0.1,
                weight: 1
            }).addTo(heatMap);
            
            // 绑定弹窗
            marker.bindPopup(`
                <div class="popup-card">
                    <h5>${point.name}</h5>
                    <p>位置：${point.lat.toFixed(6)}, ${point.lng.toFixed(6)}</p>
                    <p>管辖范围：${PARKING_RADIUS}米</p>
                    <p>实时停放车辆数：${0}</p>
                    <p>30分钟后需求预测值：${Math.round(Math.random() * 20)}</p>
                </div>
            `);
            
            // 点击事件：切换选中状态
            marker.on('click', function() {
                // 如果点击的是当前已选中的标记，则取消选中
                if (selectedMarker === this) {
                    this.setIcon(createParkingIcon(false));
                    // 重置管辖范围
                    radiusCircle.setStyle({
                        color: '#1890FF',
                        fillColor: '#1890FF',
                        fillOpacity: 0.1,
                        weight: 1
                    });
                    selectedMarker = null;
                } else {
                    // 重置之前选中的标记
                    if (selectedMarker) {
                        selectedMarker.setIcon(createParkingIcon(false));
                        // 重置之前选中的管辖范围
                        if (selectedMarker.radiusCircle) {
                            selectedMarker.radiusCircle.setStyle({
                                color: '#1890FF',
                                fillColor: '#1890FF',
                                fillOpacity: 0.1,
                                weight: 1
                            });
                        }
                    }
                    // 设置当前标记为选中状态
                    this.setIcon(createParkingIcon(true));
                    // 高亮当前停车点的管辖范围
                    radiusCircle.setStyle({
                        color: '#FF5722',
                        fillColor: '#FF5722',
                        fillOpacity: 0.2,
                        weight: 2
                    });
                    selectedMarker = this;
                    selectedMarker.radiusCircle = radiusCircle;
                }
            });
        });
        
        // 初始化显示热力图
        showHeatmap();
        
        // 初始化数据统计
        updateDataStats();
        
        // 启动定时刷新
        startAutoRefresh();
    }
    
    // 显示热力图
    function showHeatmap() {
        // 更新模式
        currentMode = 'heatmap';
        
        // 生成热力图数据
        const heatData = PARKING_POINTS.map(point => {
            // 生成随机权重值（模拟供需数据）
            const weight = Math.random() * 10;
            return [point.lat, point.lng, weight];
        });
        
        // 创建热力图层
        const heatLayer = L.heatLayer(heatData, {
            radius: 25,
            blur: 15,
            maxZoom: 19, // 与地图最大缩放一致
            max: 10, // 固定最大值，确保颜色一致性
            gradient: {
                0.0: 'green',
                0.5: 'yellow',
                1.0: 'red'
            },
            opacity: 0.6,
            // 确保热力图不随地图缩放改变颜色
            scaleRadius: false
        }).addTo(heatMap);
    }
    
    // 更新数据统计
    function updateDataStats() {
        document.getElementById('parkingSpotCount').textContent = PARKING_POINTS.length;
        document.getElementById('predictTime').textContent = '{{ current_time }}';
    }
    
    // 刷新数据
    function refreshData() {
        // 显示加载状态
        document.getElementById('refreshBtn').innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 刷新中...';
        
        // 从API获取最新数据
        fetch('/operation/api/parking-data/')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 更新数据
                    parkingSpotsData = data.data;
                    
                    // 更新数据统计
                    updateDataStats();
                    
                    // 更新当前时间
                    document.getElementById('predictTime').textContent = data.current_time;
                    
                    // 显示成功消息
                    alert('数据刷新成功！');
                } else {
                    alert('数据刷新失败：' + data.message);
                }
            })
            .catch(error => {
                console.error('刷新数据失败:', error);
                alert('数据刷新失败，请稍后重试');
            })
            .finally(() => {
                // 恢复按钮状态
                document.getElementById('refreshBtn').textContent = '手动刷新数据';
            });
    }
    
    // 启动自动刷新
    function startAutoRefresh() {
        // 每30秒自动刷新一次
        setInterval(() => {
            fetch('/operation/api/parking-data/')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // 更新数据
                        parkingSpotsData = data.data;
                        
                        // 更新数据统计
                        updateDataStats();
                        
                        // 更新当前时间
                        document.getElementById('predictTime').textContent = data.current_time;
                    }
                })
                .catch(error => {
                    console.error('自动刷新数据失败:', error);
                });
        }, 30000); // 30秒
    }
    
    // 页面加载完成后初始化
    window.onload = function() {
        initMap();
    };
</script>

        border-color: #0d6efd;
        box-shadow: inset 0 3px 5px rgba(0, 0, 0, 0.125);
    }
</style>
