{% extends "base.html" %}

{% block title %}供需热力图{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row">
        <!-- 左侧控制面板 -->
        <div class="col-md-3">
            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0">控制面板</h5>
                </div>
                <div class="card-body">
                    <!-- 地图切换按钮 -->
                    <div class="d-grid gap-2 mb-4">
                        <button id="cityMapBtn" class="btn btn-primary btn-lg active" onclick="showCityMap()">
                            显示城市地图
                        </button>
                        <button id="heatmapBtn" class="btn btn-outline-primary btn-lg" onclick="showHeatmap()">
                            显示热力图
                        </button>
                    </div>
                    
                    <!-- 数据统计 -->
                    <div class="mb-4">
                        <h6 class="text-muted">数据统计</h6>
                        <div class="row text-center">
                            <div class="col-6">
                                <p class="text-muted mb-0">停车点数量</p>
                                <p id="parkingSpotCount" class="h5 font-weight-bold">0</p>
                            </div>
                            <div class="col-6">
                                <p class="text-muted mb-0">预测时段</p>
                                <p id="predictTime" class="h5 font-weight-bold">{{ current_time }}</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 状态说明 -->
                    <div class="mb-4">
                        <h6 class="text-muted">状态说明</h6>
                        <ul class="list-unstyled text-sm">
                            <li class="mb-1">
                                <span class="inline-block w-3 h-3 bg-red-500 rounded-full mr-2"></span>
                                高需求（红色）
                            </li>
                            <li class="mb-1">
                                <span class="inline-block w-3 h-3 bg-yellow-500 rounded-full mr-2"></span>
                                中等需求（黄色）
                            </li>
                            <li class="mb-1">
                                <span class="inline-block w-3 h-3 bg-green-500 rounded-full mr-2"></span>
                                低需求（绿色）
                            </li>
                        </ul>
                    </div>
                    
                    <!-- 刷新按钮 -->
                    <button id="refreshBtn" class="btn btn-secondary w-100" onclick="refreshData()">
                        手动刷新数据
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 右侧地图展示 -->
        <div class="col-md-9">
            <div class="card mb-4">
                <div class="card-body p-0">
                    <!-- 地图容器 -->
                    <div id="map" style="height: 800px; width: 100%;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<!-- Leaflet Heat Plugin -->
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

<script>
    // 全局变量
    let map;
    let parkingMarkers = [];
    let heatLayer = null;
    let currentMode = 'city'; // 'city' 或 'heatmap'
    let yanshanBounds;
    let parkingSpotsData = {{ parking_spots|safe }};
    
    // 初始化地图
    function initMap() {
        // 燕山大学校园中心点
        const yanshanCenter = [39.9500, 119.5325];
        
        // 燕大校园边界
        yanshanBounds = [
            [39.9450, 119.5250], // 西南角
            [39.9550, 119.5400]  // 东北角
        ];
        
        // 创建地图实例
        map = L.map('map', {
            center: yanshanCenter,
            zoom: 17,
            minZoom: 15,
            maxZoom: 19, // 调整为高德底图支持的最大级别
            maxBounds: yanshanBounds,
            maxBoundsViscosity: 1.0
        });
        
        // 添加高德地图底图
        L.tileLayer('https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
            attribution: '高德地图 © 共享单车系统',
            maxZoom: 19
        }).addTo(map);
        
        // 添加校园边界
        const campusBoundary = L.polygon([
            [39.9450, 119.5250], // 西南角
            [39.9450, 119.5400], // 东南角
            [39.9550, 119.5400], // 东北角
            [39.9550, 119.5250], // 西北角
            [39.9450, 119.5250]  // 西南角
        ], {
            color: '#1E90FF',
            weight: 2,
            fillColor: '#E6F3FF',
            fillOpacity: 0.1
        }).addTo(map);
        
        // 初始化显示城市地图
        showCityMap();
        
        // 初始化数据统计
        updateDataStats();
        
        // 启动定时刷新
        startAutoRefresh();
    }
    
    // 显示城市地图
    function showCityMap() {
        // 更新按钮状态
        document.getElementById('cityMapBtn').classList.add('active', 'btn-primary');
        document.getElementById('cityMapBtn').classList.remove('btn-outline-primary');
        document.getElementById('heatmapBtn').classList.remove('active', 'btn-primary');
        document.getElementById('heatmapBtn').classList.add('btn-outline-primary');
        
        // 清除现有标记和热力图
        clearMapLayers();
        
        // 添加停车点标记（无热力颜色）
        addParkingMarkers(false);
        
        // 更新模式
        currentMode = 'city';
    }
    
    // 显示热力图
    function showHeatmap() {
        // 更新按钮状态
        document.getElementById('heatmapBtn').classList.add('active', 'btn-primary');
        document.getElementById('heatmapBtn').classList.remove('btn-outline-primary');
        document.getElementById('cityMapBtn').classList.remove('active', 'btn-primary');
        document.getElementById('cityMapBtn').classList.add('btn-outline-primary');
        
        // 清除现有标记
        clearMapLayers();
        
        // 添加停车点标记（带热力颜色）
        addParkingMarkers(true);
        
        // 更新模式
        currentMode = 'heatmap';
    }
    
    // 添加停车点标记
    function addParkingMarkers(showHeatColor) {
        // 清除现有标记
        parkingMarkers.forEach(marker => map.removeLayer(marker));
        parkingMarkers = [];
        
        // 添加新标记
        parkingSpotsData.forEach(spot => {
            // 计算标记颜色
            let markerColor;
            if (showHeatColor) {
                const difference = spot.difference;
                if (difference > 5) {
                    // 供给过剩，绿色
                    markerColor = '#28a745';
                } else if (difference < -5) {
                    // 供给不足，红色
                    markerColor = '#dc3545';
                } else {
                    // 供需平衡，黄色
                    markerColor = '#ffc107';
                }
            } else {
                // 城市地图模式，默认蓝色
                markerColor = '#007bff';
            }
            
            // 创建停车点图标
            const parkingIcon = L.divIcon({
                className: 'custom-parking-icon',
                html: `<div style="background-color: ${markerColor}; color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">P</div>`,
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
            
            // 创建标记
            const marker = L.marker([spot.latitude, spot.longitude], {
                icon: parkingIcon
            }).addTo(map);
            
            // 添加弹出信息
            marker.bindPopup(`
                <div class="p-2">
                    <h6 class="font-weight-bold">${spot.name}</h6>
                    <p class="text-sm mb-1">ID: ${spot.id}</p>
                    <p class="text-sm mb-1">坐标: ${spot.latitude.toFixed(6)}, ${spot.longitude.toFixed(6)}</p>
                    <p class="text-sm mb-1">服务半径: ${spot.service_radius}米</p>
                    ${showHeatColor ? `
                        <p class="text-sm mb-1">预测需求: ${spot.demand}辆</p>
                        <p class="text-sm mb-1">预测供给: ${spot.supply}辆</p>
                        <p class="text-sm mb-1">差值: ${spot.difference > 0 ? '+' : ''}${spot.difference}辆</p>
                    ` : ''}
                </div>
            `);
            
            parkingMarkers.push(marker);
        });
    }
    
    // 清除地图图层
    function clearMapLayers() {
        // 清除停车点标记
        parkingMarkers.forEach(marker => map.removeLayer(marker));
        parkingMarkers = [];
        
        // 清除热力图层
        if (heatLayer) {
            map.removeLayer(heatLayer);
            heatLayer = null;
        }
    }
    
    // 更新数据统计
    function updateDataStats() {
        document.getElementById('parkingSpotCount').textContent = parkingSpotsData.length;
        document.getElementById('predictTime').textContent = '{{ current_time }}';
    }
    
    // 刷新数据
    function refreshData() {
        // 显示加载状态
        document.getElementById('refreshBtn').innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 刷新中...';
        
        // 从API获取最新数据
        fetch('/operation/api/parking-data/')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 更新数据
                    parkingSpotsData = data.data;
                    
                    // 更新地图
                    if (currentMode === 'city') {
                        showCityMap();
                    } else {
                        showHeatmap();
                    }
                    
                    // 更新数据统计
                    updateDataStats();
                    
                    // 更新当前时间
                    document.getElementById('predictTime').textContent = data.current_time;
                    
                    // 显示成功消息
                    alert('数据刷新成功！');
                } else {
                    alert('数据刷新失败：' + data.message);
                }
            })
            .catch(error => {
                console.error('刷新数据失败:', error);
                alert('数据刷新失败，请稍后重试');
            })
            .finally(() => {
                // 恢复按钮状态
                document.getElementById('refreshBtn').textContent = '手动刷新数据';
            });
    }
    
    // 启动自动刷新
    function startAutoRefresh() {
        // 每30秒自动刷新一次
        setInterval(() => {
            fetch('/operation/api/parking-data/')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // 更新数据
                        parkingSpotsData = data.data;
                        
                        // 更新地图
                        if (currentMode === 'city') {
                            showCityMap();
                        } else {
                            showHeatmap();
                        }
                        
                        // 更新数据统计
                        updateDataStats();
                        
                        // 更新当前时间
                        document.getElementById('predictTime').textContent = data.current_time;
                    }
                })
                .catch(error => {
                    console.error('自动刷新数据失败:', error);
                });
        }, 30000); // 30秒
    }
    
    // 页面加载完成后初始化
    window.onload = function() {
        initMap();
    };
</script>

<style>
    /* 自定义停车点图标样式 */
    .custom-parking-icon {
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        transition: transform 0.2s;
    }
    
    .custom-parking-icon:hover {
        transform: scale(1.1);
    }
    
    /* 按钮状态样式 */
    .btn.active {
        background-color: #0d6efd;
        border-color: #0d6efd;
        box-shadow: inset 0 3px 5px rgba(0, 0, 0, 0.125);
    }
</style>
{% endblock %}
