{% extends 'base.html' %}
{% load static %}

{% block title %}创建调度任务 - 共享单车运维平台{% endblock %}

{% block content %}
<h2 class="mb-4"><i class="bi bi-plus-circle"></i> 创建调度任务</h2>

<div class="card">
    <div class="card-header">
        <h5 class="mb-0">任务信息（燕山大学校园范围）</h5>
    </div>
    <div class="card-body">
        <form method="post" action="{% url 'operation_management:task_create' %}">
            {% csrf_token %}
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">起始位置 <span class="text-danger">*</span></label>
                    <select name="start_location" class="form-select" required>
                        <option value="">请选择起始停车点</option>
                        {% for spot in spots %}
                        <option value="{{ spot.name }}">{{ spot.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">目标位置 <span class="text-danger">*</span></label>
                    <select name="end_location" class="form-select" required>
                        <option value="">请选择目标停车点</option>
                        {% for spot in spots %}
                        <option value="{{ spot.name }}">{{ spot.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">调度数量 <span class="text-danger">*</span></label>
                    <input type="number" name="dispatch_count" class="form-control" min="1" max="100" required placeholder="需要调度的车辆数">
                </div>
                <div class="col-md-6">
                    <label class="form-label">优先级</label>
                    <select name="priority" class="form-select">
                        <option value="high">高</option>
                        <option value="medium" selected>中</option>
                        <option value="low">低</option>
                    </select>
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> 创建任务</button>
                <a href="{% url 'operation_management:task_list' %}" class="btn btn-secondary ms-2">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
